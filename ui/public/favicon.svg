<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 多层次银灰渐变 - 参考 file.svg -->
    <linearGradient id="silver-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F7F9"/>
      <stop offset="30%" stop-color="#EFF2F4"/>
      <stop offset="60%" stop-color="#DADAE5"/>
      <stop offset="100%" stop-color="#C3C3CF"/>
    </linearGradient>
    
    <linearGradient id="silver-medium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2D2DC"/>
      <stop offset="50%" stop-color="#A8A8B2"/>
      <stop offset="100%" stop-color="#95959E"/>
    </linearGradient>
    
    <linearGradient id="silver-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#75757D"/>
      <stop offset="100%" stop-color="#54545D"/>
    </linearGradient>
    
    <!-- LED 蓝光渐变 -->
    <linearGradient id="led-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <!-- LED 青光渐变 -->
    <linearGradient id="led-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 头部外层轮廓 - 参考 file.svg 的圆润矩形 -->
  <rect x="26" y="24" width="68" height="56" rx="20" fill="#000000" opacity="0.12"/>
  
  <!-- 头部主体 - 多层次渐变，更像 file.svg -->
  <rect x="28" y="26" width="64" height="52" rx="18" fill="url(#silver-light)" stroke="#000000" stroke-width="2"/>
  
  <!-- 头部内层装饰 - 增加层次 -->
  <rect x="33" y="31" width="54" height="42" rx="16" fill="none" stroke="url(#silver-medium)" stroke-width="1.5" opacity="0.7"/>
  
  <!-- 头部顶部装饰线 -->
  <path d="M33 36 Q60 33 87 36" stroke="url(#silver-dark)" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- 科技感天线 - file.svg 风格 -->
  <line x1="60" y1="26" x2="60" y2="10" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="8" r="7" fill="url(#led-cyan)" filter="url(#glow)"/>
  <circle cx="60" cy="8" r="4" fill="#ffffff" opacity="0.7"/>
  
  <!-- LED 风格眼睛 - 左眼窝 - file.svg 风格 -->
  <rect x="36" y="42" width="20" height="14" rx="7" fill="#1C252F"/>
  <rect x="38" y="44" width="16" height="10" rx="5" fill="url(#led-blue)" filter="url(#glow)"/>
  <circle cx="46" cy="49" r="2.5" fill="#ffffff" opacity="0.5"/>
  
  <!-- LED 风格眼睛 - 右眼窝 -->
  <rect x="64" y="42" width="20" height="14" rx="7" fill="#1C252F"/>
  <rect x="66" y="44" width="16" height="10" rx="5" fill="url(#led-blue)" filter="url(#glow)"/>
  <circle cx="74" cy="49" r="2.5" fill="#ffffff" opacity="0.5"/>
  
  <!-- 头部侧面细节 -->
  <circle cx="30" cy="52" r="4" fill="url(#silver-medium)"/>
  <circle cx="90" cy="52" r="4" fill="url(#silver-medium)"/>
  
  <!-- 头部底部装饰线 -->
  <path d="M33 68 Q60 71 87 68" stroke="url(#silver-medium)" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- 颈部 - file.svg 风格渐变 -->
  <rect x="48" y="78" width="24" height="12" rx="6" fill="url(#silver-dark)"/>
  <rect x="51" y="80" width="18" height="8" rx="4" fill="url(#silver-medium)" opacity="0.8"/>
  
  <!-- 身体外层轮廓 - 参考 file.svg 的矩形 -->
  <rect x="20" y="90" width="80" height="40" rx="16" fill="#000000" opacity="0.1"/>
  
  <!-- 身体主体 - 多层次渐变 -->
  <rect x="22" y="92" width="76" height="36" rx="14" fill="url(#silver-light)" stroke="#000000" stroke-width="2"/>
  
  <!-- 身体内层装饰 -->
  <path d="M27 97 Q60 93 93 97" stroke="url(#silver-medium)" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- 胸部显示屏 - file.svg 风格 -->
  <rect x="35" y="100" width="50" height="22" rx="8" fill="#1C252F"/>
  <rect x="37" y="102" width="46" height="18" rx="7" fill="#000000" opacity="0.4"/>
  
  <!-- 胸部 LED 指示灯 - file.svg 风格排列 -->
  <circle cx="47" cy="109" r="4" fill="url(#led-blue)" filter="url(#glow)"/>
  <circle cx="60" cy="109" r="4" fill="url(#led-cyan)" filter="url(#glow)"/>
  <circle cx="73" cy="109" r="4" fill="url(#led-blue)" filter="url(#glow)"/>
  <circle cx="47" cy="108" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="60" cy="108" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="73" cy="108" r="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- 科技感电路线条 -->
  <path d="M27 109 L33 109" stroke="url(#silver-dark)" stroke-width="2" opacity="0.7"/>
  <path d="M87 109 L93 109" stroke="url(#silver-dark)" stroke-width="2" opacity="0.7"/>
  <circle cx="33" cy="109" r="3" fill="url(#led-cyan)" opacity="0.9"/>
  <circle cx="87" cy="109" r="3" fill="url(#led-cyan)" opacity="0.9"/>
  
  <!-- 身体侧面装饰 -->
  <rect x="24" y="104" width="5" height="10" rx="2.5" fill="url(#silver-medium)" opacity="0.8"/>
  <rect x="91" y="104" width="5" height="10" rx="2.5" fill="url(#silver-medium)" opacity="0.8"/>
</svg>